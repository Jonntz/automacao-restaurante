# Infra local da PoC (specs/006-n8n-infra). Lê o .env da raiz.
#   pnpm infra:up     → postgres + n8n-bootstrap (importa credenciais/workflows) + n8n
#   pnpm tunel:up     → ngrok expondo o Next.js (:3000) no NGROK_DOMAIN
#   docker compose --profile publico up -d → + Caddy (HTTPS) na VM da demo (specs/011-demo-publica)
name: automacao-restaurante

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
  GENERIC_TIMEZONE: America/Sao_Paulo
  TZ: America/Sao_Paulo
  # Permite $env.NEXT_API_URL, $env.WHATSAPP_PHONE_NUMBER_ID e $env.GEMINI_MODEL(_RESERVA) nos nós (valores não secretos).
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  # Numa VM pequena (Oracle E2.1.Micro) o task runner dos nós Code leva mais de 30 s para subir.
  N8N_RUNNERS_GRANT_TOKEN_TTL: "120"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
  NEXT_API_URL: ${NEXT_API_URL:-http://host.docker.internal:3000}
  # URL do Next vista pelo NAVEGADOR (logo no CSS do Chat Teste)
  APP_URL: ${APP_URL:-http://localhost:3000}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
  GEMINI_MODEL_RESERVA: ${GEMINI_MODEL_RESERVA:-gemini-3.1-flash-lite}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: importa credenciais (geradas do .env) e workflows do repo, e publica os que têm gatilho.
  n8n-bootstrap:
    image: docker.n8n.io/n8nio/n8n:2.43.4
    entrypoint: ["/bin/sh", "/projeto-n8n/bootstrap/bootstrap.sh"]
    environment:
      <<: *n8n-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      BOT_API_KEY: ${BOT_API_KEY:?defina BOT_API_KEY no .env}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?defina N8N_WEBHOOK_SECRET no .env}
    volumes:
      - ./n8n:/projeto-n8n:ro
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.4
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "127.0.0.1:5678:5678" # nunca exposto na rede; o público entra só pelo Next.js
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      n8n-bootstrap:
        condition: service_completed_successfully

  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    profiles: ["tunel"]
    command: ["http", "--url=${NGROK_DOMAIN:-defina-NGROK_DOMAIN-no-env}", "host.docker.internal:3000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Borda HTTPS da VM da demo: só /webhook/* com x-webhook-secret chega ao n8n (infra/Caddyfile).
  caddy:
    image: caddy:2.11.6-alpine
    profiles: ["publico"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMINIO: ${N8N_DOMINIO:-defina-N8N_DOMINIO-no-env}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?defina N8N_WEBHOOK_SECRET no .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
